name: Build Mypyc
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          CI_INCLUDE_PATHS: '[".github/actions/setup-python-cache/action.yml",".github/workflows/build.yaml","scripts/run_mypyc_build.py",".gitmodules","Makefile","pyproject.toml","poetry.lock","requirements-build.txt","dank_mids/**/*.py","dank_mids/_vendor/aiolimiter","dank_mids/_vendor/aiolimiter/**"]'
          CI_IGNORE_PATHS: "[]"
        run: python3 .github/scripts/ci_changes.py
  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python:
          - version: "3.10"
            abi: "310"
          - version: "3.11"
            abi: "311"
          - version: "3.12"
            abi: "312"
          - version: "3.13"
            abi: "313"
          - version: "3.14"
            abi: "314"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Initialize recorded aiolimiter revision
        run: git submodule update --init --recursive dank_mids/_vendor/aiolimiter
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python.version }}
          cache: pip
          cache-dependency-path: "requirements-build.txt

            pyproject.toml

            poetry.lock

            "
      - name: Run Mypyc
        run: python scripts/run_mypyc_build.py
      - name: Upload Linux build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: mypyc-${{ matrix.os }}-py${{ matrix.python.version }}
          path:
            "./*__mypyc*.cpython-${{ matrix.python.abi }}-x86_64-linux-gnu.so

            ./build/**/*.c

            ./build/**/*.h

            ./build/lib.*/**/*cpython-${{ matrix.python.abi }}-x86_64-linux-gnu.so

            ./dank_mids/**/*cpython-${{ matrix.python.abi }}-x86_64-linux-gnu.so

            "
          if-no-files-found: error
      - name: Upload macOS build artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v6
        with:
          name: mypyc-${{ matrix.os }}-py${{ matrix.python.version }}
          path: "./*__mypyc*.cpython-${{ matrix.python.abi }}-darwin.so

            ./build/lib.*/**/*cpython-${{ matrix.python.abi }}-darwin.so

            ./dank_mids/**/*cpython-${{ matrix.python.abi }}-darwin.so

            "
          if-no-files-found: error
      - name: Upload Windows build artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: mypyc-${{ matrix.os }}-py${{ matrix.python.version }}
          path: "./*__mypyc*.cp${{ matrix.python.abi }}-win_amd64.pyd

            ./build/lib.*/**/*cp${{ matrix.python.abi }}-win_amd64.pyd

            ./dank_mids/**/*cp${{ matrix.python.abi }}-win_amd64.pyd

            "
          if-no-files-found: error
    needs:
      - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  aggregate-build-files:
    needs:
      - build-matrix
      - ci_changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize recorded aiolimiter revision
        run: git submodule update --init --recursive dank_mids/_vendor/aiolimiter
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: mypyc-*
          path: compiled-artifacts
          merge-multiple: false
      - name: Re-apply Ubuntu 3.14 artifacts (canonical)
        uses: actions/download-artifact@v7
        with:
          pattern: mypyc-ubuntu-latest-py3.14
          path: .
          merge-multiple: true
      - name: Verify every native matrix artifact
        run: python3 .github/scripts/verify_native_artifacts.py compiled-artifacts
      - name: Normalize C files for diffchecking
        shell: bash
        run: "# Insert DIFFCHECK_PLACEHOLDER macro at the top if not present\nfor f in build/*.c; do\n  if ! grep -q 'DIFFCHECK_PLACEHOLDER' \"$f\"; then\n    sed -i '1i#ifndef DIFFCHECK_PLACEHOLDER\\n#define DIFFCHECK_PLACEHOLDER 0\\n#endif' \"$f\"\n  fi\ndone\n# Replace line number in CPy_AddTraceback with macro\nsed -i 's/\\(CPy_AddTraceback([^,]*, *[^,]*, *\\)[0-9]\\+\\(, *[^)]*)\\)/\\1DIFFCHECK_PLACEHOLDER\\2/g' build/*.c\n# Replace index in CPyStatics[...] with macro\nsed -i 's/CPyStatics\\[[0-9]\\+\\]/CPyStatics[DIFFCHECK_PLACEHOLDER]/g' build/*.c\n"
      - name: Verify generated source is current
        run: git diff --exit-code -- build
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  ci_gate:
    name: CI (build.yaml)
    if: ${{ !cancelled() }}
    needs:
      - ci_changes
      - build-matrix
      - aggregate-build-files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify validation contract
        env:
          CI_GATE_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: '["build-matrix", "aggregate-build-files"]'
        run: 'python3 -m unittest discover -s .github/scripts -p "test_*.py"

          python3 .github/scripts/ci_gate.py'
"on":
  pull_request:
    branches:
      - master
      - good-master
    paths:
      - "**"
  workflow_dispatch: null
permissions:
  contents: read
