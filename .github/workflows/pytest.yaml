name: PyTest
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          CI_INCLUDE_PATHS: '[".github/actions/setup-python-cache/action.yml","**.py","**.so","**/pytest.ini","**/pytest.yaml","poetry.lock"]'
          CI_IGNORE_PATHS: "[]"
        run: python3 .github/scripts/ci_changes.py
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        pyversion:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        include:
          - os: ubuntu-latest
            path: ~/.cache/pip
          - os: macos-latest
            path: ~/Library/Caches/pip
          - os: windows-latest
            path: ~\AppData\Local\pip\Cache
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Python (faster than using Python container)
        uses: ./.github/actions/setup-python-cache
        with:
          python-version: ${{ matrix.pyversion }}
          cache-dependency-path: "requirements-build.txt

            pyproject.toml

            poetry.lock

            "
      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: poetry-${{ runner.os }}-${{ matrix.pyversion }}-0
      - name: Install Poetry (Python3.8)
        if: steps.cached-poetry.outputs.cache-hit != 'true' &&  matrix.pyversion == '3.8'
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5
      - name: Install Poetry
        if: steps.cached-poetry.outputs.cache-hit != 'true' && matrix.pyversion != '3.8'
        uses: snok/install-poetry@v1
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.pyversion }}-${{ hashFiles('**/poetry.lock') }}-0
      - name: Install Dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction
        shell: bash
      - name: Upgrade Setuptools
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry run python -m pip install -U "setuptools<81"
        shell: bash
      - name: Run unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
        run: poetry run pytest tests/unit
        shell: bash
    needs:
      - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        pyversion:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        provider:
          - TENDERLY_PROVIDER
          - LLAMA_ETH_RPC
          - INFURA_PROVIDER
          - ALCHEMY_PROVIDER
          - RETH_PROVIDER
          - CHAINSTACK_PROVIDER
        include:
          - os: ubuntu-latest
            path: ~/.cache/pip
          - os: macos-latest
            path: ~/Library/Caches/pip
          - os: windows-latest
            path: ~\AppData\Local\pip\Cache
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Python (faster than using Python container)
        uses: ./.github/actions/setup-python-cache
        with:
          python-version: ${{ matrix.pyversion }}
          cache-dependency-path: "requirements-build.txt

            pyproject.toml

            poetry.lock

            "
      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: poetry-${{ runner.os }}-${{ matrix.pyversion }}-0
      - name: Install Poetry (Python3.8)
        if: steps.cached-poetry.outputs.cache-hit != 'true' &&  matrix.pyversion == '3.8'
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5
      - name: Install Poetry
        if: steps.cached-poetry.outputs.cache-hit != 'true' && matrix.pyversion != '3.8'
        uses: snok/install-poetry@v1
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.pyversion }}-${{ hashFiles('**/poetry.lock') }}-0
      - name: Install Dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction
        shell: bash
      - name: Upgrade Setuptools
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry run python -m pip install -U "setuptools<81"
        shell: bash
      - name: Setup brownie networks
        run: poetry run brownie networks modify mainnet host=${{ secrets[matrix.provider] }}
        shell: bash
        continue-on-error: true
      - name: Run test suite
        env:
          PYTEST_NETWORK: mainnet
          ETHERSCAN_TOKEN: ${{ secrets.ETHERSCAN_TOKEN  }}
          MAX_RETRIES: 2
          MIN_SLEEP_TIME: 1
          MAX_SLEEP_TIME: 3
        run: poetry run pytest tests/integration
        shell: bash
    needs:
      - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  ci_gate:
    name: CI (pytest.yaml)
    if: ${{ !cancelled() }}
    needs:
      - ci_changes
      - unit
      - integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify validation contract
        env:
          CI_GATE_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: '["unit","integration"]'
        run: 'python3 -m unittest discover -s .github/scripts -p "test_*.py"

          python3 .github/scripts/ci_gate.py'
"on":
  pull_request:
    branches:
      - master
    paths:
      - "**"
  workflow_dispatch: null
permissions:
  contents: read
